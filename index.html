
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World!</title>
    <link rel="stylesheet" href="style.css" />

  </head>
  <body>
    <div class="top">
      <span>© STPNG 2024</span>
    </div>
    
    <div class="status">
      <span>Choose your weapon to start the game!</span>
    </div>
    
    <div class="game">
      <div class="leftSquare">
        <div class=playerChoice></div>
        
        <div class="playerScore">
          <div><span>YOUR SCORE</span></div>
        </div>
        
      </div>
      
      <div class="rightSquare">
        <div class=pcChoice></div>
        
        <div class="pcScore">
          <div><span>PC'S SCORE</span></div>
        </div>
        
      </div>
    </div>
  
    
    <div class="buttons">
      <div id="rock" class="btn">✊</div>
      <div id="paper" class="btn">✋</div>
      <div id="scissors" class="btn">✌</div>
    </div>
    
     <a href="">RESET</a>
    
    
      
      
      <script src="javascript.js" defer></script>
  </body>
</html>
